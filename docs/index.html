<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전산·통신직 채용 정보 모니터링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F7; --card:#FFFFFF; --ink:#10233A; --muted:#6B7789;
  --rule:#DFE3EA; --seal:#0E7C6B; --alert:#B4331F;
  --display:"Nanum Myeongjo",serif;
  --body:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --data:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px}

/* ── 머리말 */
.eyebrow{font-family:var(--data);font-size:11px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(23px,6.2vw,32px);
  line-height:1.26;letter-spacing:-.01em;margin:8px 0 6px;word-break:keep-all}
.sub{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0;word-break:keep-all}

/* ── 접수인 (이 페이지의 signature) */
.seal-row{display:flex;align-items:center;gap:18px;margin:26px 0 8px}
.seal{flex:0 0 auto;width:104px;height:104px;display:grid;place-items:center;
  border:2.5px solid var(--seal);border-radius:3px;color:var(--seal);
  transform:rotate(-4deg);position:relative;background:var(--card)}
.seal::after{content:"";position:absolute;inset:5px;border:1px solid var(--seal);
  border-radius:2px;opacity:.55}
.seal.zero{border-color:var(--muted);color:var(--muted)}
.seal.zero::after{border-color:var(--muted)}
.seal .n{font-family:var(--data);font-weight:500;font-size:40px;line-height:1}
.seal .lbl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.22em;
  margin-top:5px;padding-left:.22em}
.seal-text .big{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.4}
.seal-text .small{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55}
@media (prefers-reduced-motion:no-preference){
  .seal{animation:stamp .42s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes stamp{from{transform:rotate(-4deg) scale(1.5);opacity:0}
    to{transform:rotate(-4deg) scale(1);opacity:1}}
}

.range{font-family:var(--data);font-size:11.5px;color:var(--muted);margin-top:24px;
  letter-spacing:.02em}

/* ── 출처 필터 */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.chip{font-family:var(--data);font-size:11.5px;letter-spacing:.02em;padding:6px 11px;
  border:1px solid var(--rule);background:var(--card);color:var(--muted);
  border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
.chip:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* ── 목록 */
.band{font-family:var(--data);font-size:11px;letter-spacing:.14em;color:var(--muted);
  border-top:1.5px solid var(--ink);padding-top:9px;margin:30px 0 0;
  display:flex;justify-content:space-between;align-items:baseline}
.item{background:var(--card);border:1px solid var(--rule);border-top:none;padding:15px 15px 14px}
.item:first-of-type{border-top:1px solid var(--rule)}
.item .org{font-size:12.5px;font-weight:600;color:var(--muted)}
.item .ttl{display:block;font-size:16px;font-weight:600;line-height:1.48;word-break:keep-all;
  color:var(--ink);text-decoration:none;margin:4px 0 9px}
.item .ttl:hover,.item .ttl:focus-visible{color:var(--seal);text-decoration:underline}
.meta{font-family:var(--data);font-size:11.5px;color:var(--muted);display:flex;
  flex-wrap:wrap;gap:5px 9px;align-items:center}
.tag{border:1px solid var(--rule);padding:2px 6px;border-radius:2px}
.tag.new{border-color:var(--seal);color:var(--seal)}
.dday{font-weight:500}
.dday.soon{color:var(--alert)}
/* 읽은 공고 */
.item.read{background:#FAFBFC}
.item.read .ttl{color:var(--muted);font-weight:500}
.item.read .org,.item.read .meta{color:#98A2B3}
.item.read .tag{border-color:#E8EBF0;color:#98A2B3}
.item.read .tag.new{border-color:#B8CFC9;color:#8FA9A3}
.item.read .dday.soon{color:#C08A80}
.item.read .ttl::after{content:"읽음";font-family:var(--data);font-size:10px;
  letter-spacing:.08em;color:#98A2B3;margin-left:7px;vertical-align:1px;white-space:nowrap}
.reset{background:none;border:none;padding:0;margin-top:8px;font-family:var(--data);
  font-size:11.5px;color:var(--muted);cursor:pointer;text-decoration:underline}
.reset:hover{color:var(--ink)}

.empty{background:var(--card);border:1px dashed var(--rule);padding:26px 18px;
  text-align:center;color:var(--muted);font-size:14px;line-height:1.7;word-break:keep-all}
footer{margin-top:34px;font-size:12px;line-height:1.7;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:14px}
.more{margin-top:14px;font-family:var(--data);font-size:12px;background:var(--card);
  border:1px solid var(--rule);padding:11px 14px;color:var(--ink);cursor:pointer;width:100%;
  letter-spacing:.02em}
.more:hover{border-color:var(--ink)}
.more:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.more.on{border-color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="stamp-date">—</div>
  <h1>전산·통신직 채용 정보 모니터링</h1>
  <p class="sub">공공기관·지방공기업·공무원 채용공고를 매일 아침 한 번 훑습니다. 최근 30일치를 게시일 최신순으로 보여 줍니다.</p>

  <div class="seal-row">
    <div class="seal zero" id="seal"><div><div class="n" id="seal-n">–</div><div class="lbl">신규</div></div></div>
    <div class="seal-text">
      <div class="big" id="seal-title">불러오는 중</div>
      <div class="small" id="seal-note">잠시만 기다려 주세요.</div>
    </div>
  </div>

  <div class="range" id="range"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
  <div id="reset"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS = ["일","월","화","수","목","금","토"];
const WINDOW_DAYS = 30;   // 화면에 보여줄 기간. 이 숫자만 바꾸면 된다
const READ_KEY = "jobwatch:read";

// 읽은 공고는 이 브라우저에만 기록된다. 휴대폰과 PC는 따로 관리된다.
function readSet() {
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function saveRead(set) {
  try { localStorage.setItem(READ_KEY, JSON.stringify([...set])); } catch (e) {}
}
let READ = readSet();
let ALL = [], SOURCE = "전체", TODAY = "", CUTOFF = "", ARCHIVE = false;

const ddayText = d => d === null || d === undefined ? "" : (d < 0 ? "마감" : d === 0 ? "오늘 마감" : "D-" + d);
const posted = p => p.start_date || p.first_seen || "";
const fmt = iso => {
  const d = new Date(iso + "T00:00:00");
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + DAYS[d.getDay()] + ")";
};

// 오늘부터 n일 전 날짜
function backDays(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() - (n - 1));
  return d.toISOString().slice(0, 10);
}

function card(p, isNew) {
  const bits = [];
  const isRead = READ.has(p.uid);
  if (isNew) bits.push('<span class="tag new">신규</span>');
  bits.push('<span class="tag">' + esc(p.source_label) + "</span>");
  if (p.region) bits.push("<span>" + esc(p.region) + "</span>");
  if (p.hire_type) bits.push("<span>" + esc(p.hire_type) + "</span>");
  const d = ddayText(p.d_day);
  if (d) bits.push('<span class="dday' + (typeof p.d_day === "number" && p.d_day <= 7 ? " soon" : "") + '">' + d + "</span>");
  const period = [p.start_date, p.end_date].filter(Boolean).join(" ~ ");
  if (period) bits.push("<span>" + esc(period) + "</span>");

  const t = esc(p.title);
  const title = p.url
    ? '<a class="ttl" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + t + "</a>"
    : '<span class="ttl">' + t + "</span>";
  return '<article class="item' + (isRead ? " read" : "") + '" data-uid="' + esc(p.uid) + '">' +
         '<div class="org">' + esc(p.org) + "</div>" + title +
         '<div class="meta">' + bits.join("") + "</div></article>";
}

// 게시일 최신순, 같으면 발견일 최신순, 그다음 기관명
const byNewest = (a, b) =>
  posted(b).localeCompare(posted(a)) ||
  (b.first_seen || "").localeCompare(a.first_seen || "") ||
  (a.org || "").localeCompare(b.org || "", "ko");

function inWindow(p) {
  return ARCHIVE || (p.first_seen || "") >= CUTOFF;
}

function render() {
  const pool = (SOURCE === "전체" ? ALL : ALL.filter(p => p.source_label === SOURCE))
    .filter(p => !p.duplicate_of_other_source)
    .filter(inWindow);

  const fresh = pool.filter(p => p.first_seen === TODAY).sort(byNewest);
  const rest  = pool.filter(p => p.first_seen !== TODAY).sort(byNewest);

  let html = '<div class="band"><span>오늘 신규</span><span>' + fresh.length + "건</span></div>";
  html += fresh.length
    ? fresh.map(p => card(p, true)).join("")
    : '<div class="empty">오늘 새로 올라온 전산·통신직 공고가 없습니다.<br>내일 아침 9시에 다시 확인합니다.</div>';

  if (rest.length) {
    html += '<div class="band"><span>' + (ARCHIVE ? "보관 중" : "이전 공고") +
            '</span><span>' + rest.length + "건</span></div>";
    html += rest.map(p => card(p, false)).join("");
  }

  const archived = ALL.filter(p => !p.duplicate_of_other_source &&
                                   (p.first_seen || "") < CUTOFF).length;
  if (ARCHIVE) {
    html += '<button class="more on" id="toggle">최근 ' + WINDOW_DAYS + '일만 보기</button>';
  } else if (archived) {
    html += '<button class="more" id="toggle">보관 중인 지난 공고 ' + archived + "건 보기</button>";
  }

  $("#list").innerHTML = html;

  $("#list").querySelectorAll(".item .ttl[href]").forEach(a => a.addEventListener("click", () => {
    const item = a.closest(".item");
    const uid = item && item.dataset.uid;
    if (!uid || READ.has(uid)) return;
    READ.add(uid);
    saveRead(READ);
    item.classList.add("read");
    updateReset();
  }));

  const btn = $("#toggle");
  if (btn) btn.onclick = () => { ARCHIVE = !ARCHIVE; refresh(); window.scrollTo({top: 0}); };
  return fresh.length;
}

function updateReset() {
  const known = new Set(ALL.map(p => p.uid));
  const n = [...READ].filter(u => known.has(u)).length;
  const box = $("#reset");
  if (!box) return;
  box.innerHTML = n
    ? '<button class="reset" id="resetbtn">읽음 표시 지우기 (' + n + "건)</button>"
    : "";
  const b = $("#resetbtn");
  if (b) b.onclick = () => {
    READ = new Set([...READ].filter(u => !known.has(u)));   // 지금 화면 밖의 기록은 남긴다
    saveRead(READ);
    render();
    updateReset();
  };
}

function refresh() {
  const labels = [...new Set(ALL.filter(inWindow).map(p => p.source_label))].sort();
  if (!labels.includes(SOURCE)) SOURCE = "전체";
  chips(labels);
  const n = render();
  updateReset();
  $("#range").textContent = ARCHIVE
    ? "보관 중인 공고 전체 · 접수 진행 중인 건만"
    : (CUTOFF ? fmt(CUTOFF) + " ~ " + fmt(TODAY) + " · 최근 " + WINDOW_DAYS + "일" : "");
  return n;
}

function chips(labels) {
  $("#chips").innerHTML = ["전체", ...labels]
    .map(l => '<button class="chip" aria-pressed="' + (l === SOURCE) + '">' + esc(l) + "</button>").join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    SOURCE = b.textContent;
    chips(labels); render();
  });
}

fetch("data/postings.json?v=" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    ALL = d.postings || [];
    TODAY = (d.updated_at || "").slice(0, 10) || (ALL[0] && ALL[0].first_seen) || "";
    CUTOFF = TODAY ? backDays(TODAY, WINDOW_DAYS) : "";

    const known = new Set(ALL.map(p => p.uid));
    if (READ.size > known.size * 3 + 50) {          // 너무 불어나면 정리
      READ = new Set([...READ].filter(u => known.has(u)));
      saveRead(READ);
    }

    const n = refresh();

    $("#stamp-date").textContent = (d.updated_at || TODAY || "").replace(/-/g, ".");
    $("#seal-n").textContent = n;
    $("#seal").classList.toggle("zero", n === 0);
    $("#seal-title").textContent = n ? "새 공고 " + n + "건" : "새 공고 없음";
    $("#seal-note").textContent = n
      ? "아래 목록에서 확인하세요. 같은 공고는 다시 올라오지 않습니다."
      : "최근 " + WINDOW_DAYS + "일 안에 올라온 공고는 아래에 남아 있습니다.";

    $("#foot").innerHTML = "마지막 확인 " + esc(d.updated_at || "—") +
      " · 보관 중 " + ALL.length + "건<br>" +
      "접수가 끝난 공고는 자동으로 빠집니다.";
  })
  .catch(() => {
    $("#seal-title").textContent = "데이터가 아직 없습니다";
    $("#seal-note").textContent = "수집을 한 번 실행하면 이 자리에 채워집니다.";
    $("#list").innerHTML = '<div class="empty">NAS에서 run.sh 를 한 번 실행해 보세요.</div>';
  });
</script>
</body>
</html>
