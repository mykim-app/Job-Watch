# ─────────────────────────────────────────────────────────────
# 공공·협회 전산/통신직 채용공고 수집 설정
# ─────────────────────────────────────────────────────────────

# 며칠 전 공고까지 훑을지 (중복은 어차피 걸러지므로 넉넉히 둬도 됨)
# 이 값이 웹페이지에 보이는 기간과 맞물린다
lookback_days: 30

# 화면/데이터에 남겨둘 기간
retention_days: 60

# 접수가 끝난 공고를 빼고 볼지 (마감 당일까지는 남는다)
# 마감일이 없는 상시채용 공고는 이 설정과 무관하게 계속 남는다
drop_closed: true

filters:
  # 제목·직무내용·NCS분류 중 하나라도 걸리면 수집
  include:
    - 전산
    - 전자계산
    - 정보화
    - 정보통신
    - 정보시스템
    - 정보보안
    - 정보보호
    - 개인정보
    - 네트워크
    - 서버
    - 시스템 운영
    - 시스템운영
    - 데이터베이스
    - 소프트웨어
    - 데이터
    - 클라우드
    - 인공지능
    - 사이버
    - 통신
    - 무선
    - 방송통신
    - IT
    - ICT
    - AI
    - DX
    - 디지털

  # 위 단어가 들어있어도 아래에 걸리면 제외 (오탐 제거)
  exclude:
    - 통신원
    - 통신사
    - 대외협력
    - 홍보
    - 기자
    - 통신판매
    - 디지털마케팅
    - 데이터입력
    - 조리
    - 미화
    - 경비원
    - 운전원
    # 채용공고가 아니라 결과 발표인 것들
    - 합격자
    - 최종합격
    - 서류전형 결과
    - 면접대상자
    - 합격 발표
    # 정규직이 아닌 고용형태
    # 공고 제목뿐 아니라 고용형태·채용구분 값에도 적용된다
    - 비정규직
    - 기간제
    - 청년인턴
    - 인턴
    - 대체인력
    - 임기제

  # 사람인처럼 민간기업이 섞여 오는 곳에만 적용하는 기관명 조건
  public_org_patterns:
    - 공사
    - 공단
    - 재단
    - 협회
    - 진흥원
    - 연구원
    - 연구소
    - 공제회
    - 위원회
    - 조합
    - 의료원
    - 대학교
    - 대학
    - 교육청
    - 도서관
    - 문화원
    - 센터
    - 사업소
    - 관리원
    - 기술원
    - 평가원
    - 개발원
    - 정보원
    - 학원
    - 학교

  # NCS 대분류 20 = 정보통신 (잡알리오 분류값에 이 코드/이름이 있으면 무조건 수집)
  ncs_keywords:
    - 정보통신
    - 20. 정보통신

sources:
  # ── 1) 잡알리오 (공공데이터포털: 재정경제부_공공기관 채용정보 조회서비스)
  #     공기업 / 준정부기관 / 기타공공기관. 인증키 필요
  alio:
    enabled: false          # apis.data.go.kr 는 막히는 곳이 많아 web 경로를 쓴다
    max_pages: 15          # 1페이지 100건
    ongoing_only: true     # 접수 진행중 공고만

  # ── 1-B) 잡알리오 웹사이트 직접 조회 (인증키 불필요)
  #     apis.data.go.kr 가 막히는 환경(GitHub 서버 등)을 위한 대체 경로.
  #     호스트가 job.alio.go.kr 로 달라서 따로 뚫릴 수 있다.
  #     NCS 직무를 정보통신으로 지정하므로 제목에 '전산'이 없어도 잡힌다.
  #     위 alio(API) 와 같은 데이터라 둘 다 켜면 중복 제거로 한쪽만 남는다.
  alio_web:
    enabled: true
    ncs_codes: ["R600020"]   # R600020 = 정보통신
    max_pages: 12
    since_days: 30

  # ── 2) 클린아이 잡플러스
  #     지방공기업 / 지자체 출자출연기관. 인증키 불필요
  #     모집분야를 '정보통신'으로 지정해 조회하므로, 제목에 '전산'이 없어도 잡힌다
  cleaneye:
    enabled: true
    recruit_field_codes: ["700020"]   # 700020 = 정보통신 (NCS 대분류 20)
    statuses: ["709001", "709002"]    # 709001 모집중 / 709002 모집예정 / 709003 모집마감
    field_pages: 6                    # 상태별로 최근 60건씩
    scan_pages: 10                    # 전체 목록도 상태별 최근 100건 훑기 (0 이면 생략)

  # ── 3) 나라일터
  #     공무원 / 공공기관 경력채용. 인증키 불필요
  #     목록이 10건씩만 나와서 키워드별로 나눠 조회한다
  gojobs:
    enabled: true
    max_pages: 6
    query_keywords:
      - 전산
      - 정보통신
      - 정보보안
      - 정보화
      - 네트워크
      - 정보시스템

  # ── 3-B) 전문대학포털 교직원채용 (인증키 불필요)
  #     전문대학 '직원' 공고만 조회한다. 교수 초빙은 제외.
  #     전산직 공고가 드물어 수확은 적지만 요청이 거의 없다.
  procollege:
    enabled: true
    page_unit: 50       # 한 번에 50건. 보통 두세 달치가 들어온다
    max_pages: 1

  # ── 3-C) 대학교직원신문 [직원]채용 게시판 (인증키 불필요)
  #     4년제 사립대 교직원 공고가 모이는 거의 유일한 곳.
  #     해외 IP 는 서버가 403 으로 막으므로 국내(NAS)에서만 동작한다.
  #     마감일 칸이 없어 제목 끝의 "(~09. 13(일))" 에서 뽑아 쓴다.
  uman:
    enabled: true
    max_pages: 4        # 1페이지 약 30건. 4페이지면 한 달치가 넉넉히 들어온다
    page_param: page    # 2페이지 주소가 다르면 이 이름만 바꾸면 된다
    skip_notice: false  # 상단 고정 공지도 채용공고라 기본은 포함

  # ── 4) 사람인 오픈API
  #     https://oapi.saramin.co.kr 에서 이용신청·승인 후 access-key 발급
  #     Secret 이름은 SARAMIN_ACCESS_KEY. 하루 500회 호출 제한이 있으니 키워드를 늘리지 말 것
  #     민간기업이 대부분이라 public_org_patterns 로 한 번 더 거른다
  saramin:
    enabled: true
    count: 100          # 1회 최대 110
    max_pages: 2
    since_days: 30      # 최근 30일 등록분만
    query_keywords:
      - 전산
      - 정보통신
      - 정보보안
      - 전산직

  # ── 5) 그 밖의 게시판을 직접 읽고 싶을 때 (협회 홈페이지 등)
  #     selector 를 채우고 enabled: true 로 바꾸면 동작한다. README 5번 참고
  html_boards: []
