# ─────────────────────────────────────────────────────────────
# 공공·협회 전산/통신직 채용공고 수집 설정
# ─────────────────────────────────────────────────────────────

# 며칠 전 공고까지 훑을지 (중복은 어차피 걸러지므로 넉넉히 둬도 됨)
lookback_days: 5

# 화면/데이터에 남겨둘 기간
retention_days: 60

filters:
  # 제목·직무내용·NCS분류 중 하나라도 걸리면 수집
  include:
    - 전산
    - 전자계산
    - 정보화
    - 정보통신
    - 정보시스템
    - 정보보안
    - 정보보호
    - 개인정보
    - 네트워크
    - 서버
    - 시스템 운영
    - 시스템운영
    - 데이터베이스
    - 소프트웨어
    - 데이터
    - 클라우드
    - 인공지능
    - 사이버
    - 통신
    - 무선
    - 방송통신
    - IT
    - ICT
    - AI
    - DX
    - 디지털

  # 위 단어가 들어있어도 아래에 걸리면 제외 (오탐 제거)
  exclude:
    - 통신원
    - 통신사
    - 대외협력
    - 홍보
    - 기자
    - 통신판매
    - 디지털마케팅
    - 데이터입력
    - 조리
    - 미화
    - 경비원
    - 운전원

  # NCS 대분류 20 = 정보통신 (잡알리오 분류값에 이 코드/이름이 있으면 무조건 수집)
  ncs_keywords:
    - 정보통신
    - 20. 정보통신

  # 워크넷은 민간기업이 대부분이라 기관명으로 한 번 더 거른다
  public_org_patterns:
    - 공사
    - 공단
    - 재단
    - 협회
    - 진흥원
    - 연구원
    - 연구소
    - 공제회
    - 위원회
    - 조합
    - 의료원
    - 대학교
    - 교육청
    - 도서관
    - 문화원
    - 센터
    - 사업소
    - 관리원
    - 기술원
    - 평가원
    - 개발원
    - 정보원

sources:
  # ── 1) 잡알리오 (공공데이터포털: 재정경제부_공공기관 채용정보 조회서비스)
  #     공기업 / 준정부기관 / 기타공공기관
  alio:
    enabled: true
    max_pages: 15          # 1페이지 100건
    ongoing_only: true     # 접수 진행중 공고만

  # ── 2) 워크넷 채용정보 API (고용24 오픈API)
  #     협회·재단·지자체 출연기관 등 잡알리오 밖 기관이 여기 올라옴
  worknet:
    enabled: true
    display: 100
    max_pages: 3
    # 키워드마다 따로 조회한다 (API가 OR 검색을 지원하지 않음)
    query_keywords:
      - 전산
      - 정보통신
      - 정보보안
      - 전산직
      - 정보화
      - 네트워크

  # ── 3) HTML 게시판 수집 (API가 없는 곳)
  #     selector 는 실제 페이지를 열어서 채워 넣어야 한다. README 참고.
  #     enabled: false 인 항목은 그냥 건너뛴다.
  html_boards:
    - name: 클린아이 잡플러스
      key: cleaneye
      enabled: false
      url: https://job.cleaneye.go.kr/
      note: 지방공기업·지자체 출자출연기관. 목록 selector 확인 필요.
      selectors:
        item: ""          # 예: "table.board tbody tr"
        title: ""         # 예: "td.subject a"
        link: ""          # 예: "td.subject a"
        org: ""           # 예: "td.org"
        date: ""          # 예: "td.date"
      link_base: https://job.cleaneye.go.kr

    - name: 나라일터
      key: gojobs
      enabled: false
      url: https://www.gojobs.go.kr/
      note: 공무원·공공기관 경력채용. 목록 selector 확인 필요.
      selectors:
        item: ""
        title: ""
        link: ""
        org: ""
        date: ""
      link_base: https://www.gojobs.go.kr

    # 개별 협회 채용게시판을 추가하고 싶으면 아래 형태로 계속 붙이면 된다.
    # - name: 한국정보통신공사협회
    #   key: kica
    #   enabled: false
    #   url: https://www.kica.or.kr/...
    #   selectors: { item: "", title: "", link: "", org: "", date: "" }
    #   link_base: https://www.kica.or.kr
