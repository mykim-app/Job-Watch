name: daily-job-watch

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          ALIO_SERVICE_KEY: ${{ secrets.ALIO_SERVICE_KEY }}
          WORKNET_AUTH_KEY: ${{ secrets.WORKNET_AUTH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python main.py

      - name: 결과 커밋
        run: |
          git config user.name  "job-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/postings.json
          git diff --staged --quiet || git commit -m "공고 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
